[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trailprint"
version = "0.1.0"
description = "Turn GPX tracks into printable 3D route models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<4",
    "mapbox-earcut>=1,<2",
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
    "shapely>=2,<3",
    "trimesh>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
trailprint = "trailprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trailprint = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["prints"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
